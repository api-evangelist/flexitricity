name: Flexitricity
kind: company
description: >-
  Flexitricity Limited is an Edinburgh-based energy flexibility aggregator and
  licensed electricity supplier operating what it describes as the first, largest
  and most advanced demand response portfolio in Great Britain — a virtual power
  plant exceeding 1GW. Founded in 2004 by Dr Alastair Martin, acquired by Alpiq in
  2014, merged with Quinbrook's Velox Power in 2022, and per the company's own
  timeline acquired by Drax in 2026, it sits in the value chain between commercial,
  industrial and aggregated domestic energy assets and the GB wholesale and
  balancing markets. It routes customer assets — batteries, standby generation,
  industrial load, hydrogen electrolysers, co-located sites and, through its FlexGO
  product, residential EV charging — into the Balancing Mechanism, Capacity Market,
  frequency response, reserve services, the Demand Flexibility Service, DNO
  flexibility markets and wholesale trading. Its API posture is closed: Flexitricity
  publishes no developer portal, no documented public API, no OpenAPI, and no open
  market data of its own. The developer-facing subdomains developer., developers.,
  docs., api. and data. do not resolve; the only interactive surface is
  portal.flexitricity.com, which requires a customer account. The United Kingdom has
  no consumer data-portability mandate comparable to Australia's Consumer Data Right,
  so nothing compels Flexitricity to expose customer usage data through an API. The
  open, machine-readable data about Flexitricity is published by Elexon, not by
  Flexitricity — its 63 registered BM Units under lead party FLEXTRCY are retrievable
  anonymously from the Elexon BMRS Insights API. Open on the regulator's side,
  closed on its own: that split is the finding.
