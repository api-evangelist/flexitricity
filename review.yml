  - url: https://data.elexon.co.uk/bmrs/api/v1/reference/bmunits/all
    type: ThirdPartyRegister
    note: Elexon BMRS Insights API. Anonymous register entry proving Flexitricity's
      BSC lead-party status and 63 BM Units. Elexon's API, not Flexitricity's.

actions:
  apisYmlCreated: true
  apisListed: 0
  openapiDirectoryCreated: false
  reason: >-
    apis[] is empty because Flexitricity documents no public API. No OpenAPI,
    Swagger, AsyncAPI, GraphQL schema, Postman collection or machine-readable
    contract of any kind was found on any host operated by the company. Nothing was
    fabricated, and no soft-404 HTML response was saved as a specification. The
    profile is identity plus an evidenced negative — which, for a GB flexibility
    aggregator with no consumer data mandate, is the accurate state of the world.
